<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSOL Tile — 상품 상세</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<script src="data.js"></script>
<style>
  :root{
    --primary:#00B8FF;
    --dark:#212121;
    --bg:#FFFFFF;
    --text:#212121;
    --card-bg:#FFFFFF;
    --border:#E2E2E2;
    --muted:#6B6B6B;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Public Sans',sans-serif;
    line-height:1.5;
  }
  header{
    background:var(--card-bg);
    border-bottom:1px solid var(--border);
    padding:20px 32px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    position:sticky;
    top:0;
    z-index:10;
  }
  .logo{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:22px;
    letter-spacing:-0.02em;
    color:var(--text);
    text-decoration:none;
  }
  .logo span{color:var(--primary);}
  nav a{
    color:var(--muted);
    text-decoration:none;
    font-size:14px;
    font-weight:600;
    margin-left:28px;
  }

  main{max-width:1100px;margin:0 auto;padding:32px;}

  .breadcrumb{
    font-size:13px;
    color:var(--muted);
    margin-bottom:24px;
  }
  .breadcrumb a{color:var(--muted);text-decoration:none;}
  .breadcrumb a:hover{color:var(--primary);}

  .product-layout{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:48px;
  }
  @media (max-width:820px){
    .product-layout{grid-template-columns:1fr;}
  }

  .product-img{
    width:100%;
    aspect-ratio:1/1;
    object-fit:cover;
    border-radius:12px;
    border:1px solid var(--border);
  }

  .badge-row{
    display:flex;
    flex-wrap:wrap;
    gap:8px;
    margin-bottom:14px;
  }
  .badge-b2b{
    display:inline-block;
    background:var(--dark);
    color:#fff;
    font-size:13px;
    font-weight:700;
    padding:5px 12px;
    border-radius:4px;
    letter-spacing:0.02em;
  }
  .badge-b2b.badge-outline{
    background:#fff;
    color:var(--dark);
    border:1px solid var(--dark);
  }
  .product-title{
    font-family:'Archivo',sans-serif;
    font-weight:900;
    font-size:34px;
    letter-spacing:-0.02em;
    margin-bottom:8px;
  }
  .product-sub{
    color:var(--muted);
    font-size:15px;
    margin-bottom:24px;
  }

  .spec-table{
    width:100%;
    border-top:1px solid var(--border);
    margin-bottom:28px;
  }
  .spec-table div{
    display:flex;
    justify-content:space-between;
    padding:10px 0;
    border-bottom:1px solid var(--border);
    font-size:14px;
  }
  .spec-table div span:first-child{color:var(--muted);}
  .spec-table div span:last-child{font-weight:600;}

  .calc-box{
    background:#F7F7F7;
    border:1px solid var(--border);
    border-radius:12px;
    padding:20px;
    margin-bottom:24px;
  }
  .calc-title{
    font-weight:700;
    font-size:15px;
    margin-bottom:4px;
  }
  .calc-hint{
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:14px;
  }
  .calc-row{
    display:flex;
    gap:10px;
    align-items:center;
  }
  .calc-row input{
    flex:1;
    padding:10px 12px;
    border:1px solid var(--border);
    border-radius:8px;
    font-size:14px;
    font-family:inherit;
  }
  .calc-row input:focus{
    outline:2px solid var(--primary);
    outline-offset:1px;
  }
  .calc-unit{font-size:14px;color:var(--muted);white-space:nowrap;}

  .calc-result{
    margin-top:16px;
    padding-top:16px;
    border-top:1px dashed var(--border);
    display:none;
  }
  .calc-result.show{display:block;}
  .calc-result-row{
    display:flex;
    justify-content:space-between;
    font-size:14px;
    margin-bottom:6px;
  }
  .calc-result-row.total{
    font-weight:800;
    font-size:16px;
    color:var(--primary);
  }
  .calc-warn{
    margin-top:10px;
    font-size:12.5px;
    color:#B00020;
    font-weight:600;
  }

  .order-btn{
    width:100%;
    background:var(--primary);
    color:#fff;
    border:none;
    padding:16px;
    border-radius:8px;
    font-size:15px;
    font-weight:700;
    font-family:inherit;
    cursor:pointer;
  }
  .order-note{
    text-align:center;
    font-size:12.5px;
    color:var(--muted);
    margin-top:10px;
  }

  footer{
    border-top:1px solid var(--border);
    padding:28px 32px;
    text-align:center;
    color:var(--muted);
    font-size:12.5px;
    margin-top:40px;
  }

  .installed-box{margin-top:24px;}
  .installed-title{
    font-weight:700;
    font-size:15px;
    margin-bottom:10px;
  }
  .installed-img{
    width:100%;
    border-radius:12px;
    border:1px solid var(--border);
    display:block;
  }
  .angle-row{
    display:flex;
    gap:12px;
    margin-top:24px;
  }
  .angle-row .product-img{
    max-width:180px;
  }
</style>
</head>
<body>

<header>
  <a href="index.html" class="logo"><span>SSOL</span> TILE</a>
  <nav>
    <a href="index.html">600×600 포세린</a>
    <a href="#">전체 제품</a>
    <a href="#">회사 소개</a>
    <a href="#">문의</a>
  </nav>
</header>

<main id="app"></main>

<footer>
  SSOL Tile · B2B 전용 온라인 자재 공급 · 이 상세페이지는 임시 데모 화면입니다.
</footer>

<script>
  const params = new URLSearchParams(location.search);
  const product = PRODUCTS.find(p => p.id === params.get('id')) || PRODUCTS[0];

  document.title = `SSOL Tile — ${product.name}`;

  document.getElementById('app').innerHTML = `
    <div class="breadcrumb"><a href="index.html">600×600 포세린</a> / ${product.name}</div>
    <div class="product-layout">
      <div>
        <img class="product-img" src="${product.img}" alt="${product.name}">
        ${product.angleImg ? `
        <div class="angle-row">
          <img class="product-img" src="${product.angleImg}" alt="${product.name} 각도컷">
        </div>` : ''}
      </div>
      <div>
        <div class="badge-row">
          <span class="badge-b2b">${product.size}</span>
          <span class="badge-b2b badge-outline">${product.material}</span>
          <span class="badge-b2b badge-outline">${product.finish}</span>
        </div>
        <h1 class="product-title">${product.name}</h1>
        <div class="product-sub">${product.material} · B2B 전용 · 최소 ${MIN_ORDER_BOXES}박스부터 주문 가능</div>

        <div class="spec-table">
          <div><span>규격</span><span>${product.size} mm</span></div>
          <div><span>재질</span><span>${product.material}</span></div>
          <div><span>색상</span><span>${product.color}</span></div>
          <div><span>박스당 면적</span><span>${product.areaLabel}</span></div>
          ${product.pcsPerBox ? `<div><span>박스당 매수</span><span>${product.pcsPerBox}pcs</span></div>` : ''}
          <div><span>원산지</span><span>${product.origin}</span></div>
          <div><span>최소 주문</span><span>${MIN_ORDER_BOXES}박스</span></div>
        </div>

        <div class="calc-box">
          <div class="calc-title">타일 필요 수량 계산기</div>
          <div class="calc-hint">시공할 면적(㎡)을 입력하면 필요한 박스 수를 계산해 드립니다.</div>
          <div class="calc-row">
            <input type="number" id="area-input" min="0" step="0.1" placeholder="예: 20">
            <span class="calc-unit">㎡</span>
          </div>
          <div class="calc-result" id="calc-result">
            <div class="calc-result-row"><span>필요 박스 수 (여유분 5% 포함)</span><span id="result-boxes"></span></div>
            <div class="calc-result-row total"><span>최종 주문 수량</span><span id="result-final"></span></div>
            <div class="calc-warn" id="calc-warn" style="display:none;"></div>
          </div>
        </div>

        <button class="order-btn" id="order-btn">주문 문의하기</button>
        <div class="order-note">결제/배송 연동 전 단계 — 지금은 주문 접수만 가능합니다.</div>

        ${product.installedImg ? `
        <div class="installed-box">
          <div class="installed-title">시공 이미지</div>
          <img class="installed-img" src="${product.installedImg}" alt="${product.name} 시공 예시">
        </div>` : ''}
      </div>
    </div>
  `;

  const areaInput = document.getElementById('area-input');
  const resultBox = document.getElementById('calc-result');
  const resultBoxes = document.getElementById('result-boxes');
  const resultFinal = document.getElementById('result-final');
  const calcWarn = document.getElementById('calc-warn');

  areaInput.addEventListener('input', () => {
    const area = parseFloat(areaInput.value);
    if (!area || area <= 0) {
      resultBox.classList.remove('show');
      return;
    }
    // ponytail: 여유분(로스율) 5% 고정 — 실제 시공 로스율은 패턴/절단 방식에 따라 다르므로
    // 나중에 시공 방식 선택 옵션이 필요해지면 가변으로 교체.
    const rawBoxes = Math.ceil((area * 1.05) / product.coverageM2PerBox);
    const finalBoxes = Math.max(rawBoxes, MIN_ORDER_BOXES);

    resultBoxes.textContent = `${rawBoxes}박스`;
    resultFinal.textContent = `${finalBoxes}박스`;

    if (rawBoxes < MIN_ORDER_BOXES) {
      calcWarn.style.display = 'block';
      calcWarn.textContent = `최소 주문 수량(${MIN_ORDER_BOXES}박스) 미만이라 ${MIN_ORDER_BOXES}박스로 자동 조정됩니다.`;
    } else {
      calcWarn.style.display = 'none';
    }
    resultBox.classList.add('show');
  });

  document.getElementById('order-btn').addEventListener('click', () => {
    alert('주문 접수 기능은 준비 중입니다. (결제 연동 전 데모 단계)');
  });
</script>

</body>
</html>
