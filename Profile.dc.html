<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <title>개인정보 수정 — MOKTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
:root { --terra:#c9610d; --terra-light:#e5822a; --tan:#dbab55; --bg:#3a2a22; --text:#f0e9e0; --muted:#a89a8c; --border:rgba(255,255,255,0.14); }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Public Sans',sans-serif; line-height:1.6; }
a { color: var(--terra-light); text-decoration: none; }
a:hover { color: var(--tan); }
input { padding:11px 12px; border:1px solid var(--border); border-radius:7px; font-size:14px; background:rgba(0,0,0,0.22); color:var(--text); font-family:inherit; }
input:focus { outline:2px solid var(--terra); outline-offset:1px; }
label { display:flex; flex-direction:column; gap:6px; font-size:12.5px; font-weight:600; color:var(--muted); }
  </style>
</helmet>

<header style="background:#1e120c;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.1)">
  <a href="Home.dc.html" style="font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;letter-spacing:-0.02em;color:#fff;display:flex;align-items:baseline"><span style="color:var(--terra-light)">MOK</span>TO<em style="font-family:'Public Sans',sans-serif;font-style:normal;font-weight:600;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.55);margin-left:9px;align-self:center">TILE SUPPLY</em></a>
  <nav style="display:flex;align-items:center;gap:22px">
    <a href="Home.dc.html" style="color:rgba(255,255,255,0.78);font-size:13px;font-weight:600">상품 목록</a>
    <a href="MyPage.dc.html" style="color:rgba(255,255,255,0.78);font-size:13px;font-weight:600">마이페이지</a>
    <a href="Cart.dc.html" style="color:rgba(255,255,255,0.8);display:inline-flex;align-items:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </a>
  </nav>
</header>

<main style="max-width:640px;margin:0 auto;padding:36px 32px 80px">
  <a href="MyPage.dc.html" style="font-size:13px;font-weight:600;color:var(--muted)">← 마이페이지</a>
  <h1 style="font-family:'Archivo',sans-serif;font-weight:900;font-size:28px;letter-spacing:-0.02em;margin:16px 0 26px">개인정보 수정</h1>

  <div style="background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:16px">
    <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;color:var(--tan);margin-bottom:2px">담당자 정보</div>
    <label>이름
      <input value="{{ name }}" onInput="{{ onName }}" placeholder="홍길동">
    </label>
    <label>이메일 (아이디)
      <input value="{{ email }}" disabled="" style="opacity:0.55">
    </label>
    <label>연락처
      <input value="{{ phone }}" onInput="{{ onPhone }}" placeholder="010-0000-0000">
    </label>

    <div style="height:1px;background:var(--border);margin:8px 0"></div>
    <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:15px;color:var(--tan);margin-bottom:2px">사업자 · 배송지</div>
    <label>상호
      <input value="{{ company }}" onInput="{{ onCompany }}" placeholder="○○인테리어">
    </label>
    <label>사업자등록번호
      <input value="{{ bizNo }}" onInput="{{ onBizNo }}" placeholder="000-00-00000">
    </label>
    <label>기본 배송지
      <input value="{{ address }}" onInput="{{ onAddress }}" placeholder="시/도 구/군 도로명 주소">
    </label>

    <div style="display:flex;align-items:center;gap:12px;margin-top:10px">
      <button onClick="{{ onSave }}" style="padding:12px 26px;background:var(--terra);color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">저장</button>
      <span style="font-size:12.5px;color:var(--tan);font-weight:600">{{ msg }}</span>
    </div>
  </div>
</main>

<footer style="background:#1e120c;border-top:1px solid rgba(255,255,255,0.1);padding:32px;text-align:center;color:rgba(255,255,255,0.7);font-size:12.5px">
  MOKTO 목토 · B2B 전용 온라인 자재 공급
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
const PROFILE_KEY = 'mokto_profile';

class Component extends DCLogic {
  state = { session: null, form: { name: '', phone: '', company: '', bizNo: '', address: '' }, msg: '' };

  componentDidMount() {
    // 관리자 표시명 마이그레이션
    try {
      const AEMAIL = 'admin@ssoltile.com', ANAME = '강수민';
      let us = JSON.parse(localStorage.getItem('ssol_users') || '[]');
      let changed = false;
      us.forEach(u => { if (u.email === AEMAIL && u.name !== ANAME) { u.name = ANAME; changed = true; } });
      if (changed) localStorage.setItem('ssol_users', JSON.stringify(us));
      const ss = JSON.parse(localStorage.getItem('ssol_session') || 'null');
      if (ss && ss.email === AEMAIL && ss.name !== ANAME) localStorage.setItem('ssol_session', JSON.stringify({ ...ss, name: ANAME }));
    } catch (e) {}
    let session = null, saved = {};
    try { session = JSON.parse(localStorage.getItem('ssol_session') || 'null'); } catch (e) {}
    try { saved = JSON.parse(localStorage.getItem(PROFILE_KEY) || '{}'); } catch (e) {}
    this.setState({
      session,
      form: { name: saved.name || (session ? session.name : ''), phone: saved.phone || '', company: saved.company || '', bizNo: saved.bizNo || '', address: saved.address || '' },
    });
  }

  set(key) {
    return (e) => this.setState({ form: { ...this.state.form, [key]: e.target.value }, msg: '' });
  }

  renderVals() {
    const f = this.state.form;
    return {
      ...f,
      email: this.state.session ? this.state.session.email : '—',
      msg: this.state.msg,
      onName: this.set('name'),
      onPhone: this.set('phone'),
      onCompany: this.set('company'),
      onBizNo: this.set('bizNo'),
      onAddress: this.set('address'),
      onSave: () => {
        try { localStorage.setItem(PROFILE_KEY, JSON.stringify(f)); } catch (e) {}
        this.setState({ msg: '저장되었습니다.' });
      },
    };
  }
}
</script>
</body>
</html>
