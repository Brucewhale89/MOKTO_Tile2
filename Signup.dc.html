<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>회원가입 — SSOL TILE</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
:root { --deep-green:#1a3a30; --terra:#b5651d; --cream:#f2ede4; --text:#1a1a1a; --muted:#6b6b6b; --border:#e0dcd0; }
body { margin:0; background:var(--cream); color:var(--text); font-family:'Public Sans',sans-serif; line-height:1.6; }
a { color: var(--terra); text-decoration: none; }
a:hover { color: #cc8542; }
input { font-family: inherit; }
  </style>
</helmet>

<header style="background:var(--deep-green);padding:18px 32px;display:flex;align-items:center;justify-content:space-between">
  <a href="Home.dc.html" style="font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;letter-spacing:-0.02em;color:#fff"><span style="color:#cc8542">SSOL</span> TILE</a>
  <a href="Home.dc.html" style="color:rgba(255,255,255,0.7);font-size:13px;font-weight:600">← 쇼핑몰</a>
</header>

<main style="max-width:460px;margin:0 auto;padding:60px 24px">
  <h1 style="font-family:'Archivo',sans-serif;font-weight:900;font-size:30px;letter-spacing:-0.02em;margin:0 0 8px">회원가입</h1>
  <p style="font-size:14px;color:var(--muted);margin:0 0 28px">사업자 파트너 계정을 신청합니다. 관리자 승인 후 이용할 수 있습니다.</p>

  <div style="background:#fff;border:1px solid var(--border);border-radius:12px;padding:26px 24px;display:flex;flex-direction:column;gap:15px">
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">아이디 (이메일)
      <input value="{{ email }}" onInput="{{ onF.email }}" placeholder="partner@company.com" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">담당자명
      <input value="{{ name }}" onInput="{{ onF.name }}" placeholder="홍길동" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">상호 / 사업자명
      <input value="{{ company }}" onInput="{{ onF.company }}" placeholder="쏠타일 인테리어" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">연락처
      <input value="{{ phone }}" onInput="{{ onF.phone }}" placeholder="010-0000-0000" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
    </label>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">비밀번호
        <input type="password" value="{{ pw }}" onInput="{{ onF.pw }}" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
      </label>
      <label style="display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)">비밀번호 확인
        <input type="password" value="{{ pw2 }}" onInput="{{ onF.pw2 }}" style="padding:11px 12px;border:1px solid var(--border);border-radius:7px;font-size:14px;color:var(--text)">
      </label>
    </div>
    <sc-if value="{{ hasMsg }}" hint-placeholder-val="{{ false }}">
      <div style="border-radius:7px;padding:10px 12px;font-size:12.5px;font-weight:600;background:rgba(181,101,29,0.1);color:var(--terra)">{{ msg }}</div>
    </sc-if>
    <button onClick="{{ onSubmit }}" style="padding:13px;background:var(--terra);color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit">가입 신청</button>
    <div style="text-align:center;font-size:13px;color:var(--muted)">이미 계정이 있으신가요? <a href="Login.dc.html" style="font-weight:700">로그인</a></div>
  </div>
</main>
</x-dc>
<script type="text/x-dc" data-dc-script>
const USERS_KEY = 'ssol_users';

class Component extends DCLogic {
  state = { email: '', name: '', company: '', phone: '', pw: '', pw2: '', msg: '' };

  set(k, v) { this.setState({ [k]: v, msg: '' }); }

  submit() {
    const { email, name, company, phone, pw, pw2 } = this.state;
    if (!email.trim() || !name.trim() || !pw) { this.setState({ msg: '필수 항목을 모두 입력하세요.' }); return; }
    if (!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email.trim())) { this.setState({ msg: '이메일 형식이 올바르지 않습니다.' }); return; }
    if (pw.length < 6) { this.setState({ msg: '비밀번호는 6자 이상이어야 합니다.' }); return; }
    if (pw !== pw2) { this.setState({ msg: '비밀번호가 일치하지 않습니다.' }); return; }
    let users = [];
    try { users = JSON.parse(localStorage.getItem(USERS_KEY) || '[]'); } catch (e) {}
    if (users.some(u => u.email === email.trim().toLowerCase())) { this.setState({ msg: '이미 등록된 이메일입니다.' }); return; }
    users.push({ email: email.trim().toLowerCase(), name: name.trim(), company, phone, pw, role: 'partner', approved: false, joinedAt: new Date().toISOString() });
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); } catch (e) {}
    this.setState({ msg: '가입 신청이 접수되었습니다. 관리자 승인 후 로그인할 수 있습니다.', email: '', name: '', company: '', phone: '', pw: '', pw2: '' });
  }

  renderVals() {
    const s = this.state;
    return {
      email: s.email, name: s.name, company: s.company, phone: s.phone, pw: s.pw, pw2: s.pw2,
      msg: s.msg, hasMsg: !!s.msg,
      onF: {
        email: e => this.set('email', e.target.value),
        name: e => this.set('name', e.target.value),
        company: e => this.set('company', e.target.value),
        phone: e => this.set('phone', e.target.value),
        pw: e => this.set('pw', e.target.value),
        pw2: e => this.set('pw2', e.target.value),
      },
      onSubmit: () => this.submit(),
    };
  }
}
</script>
</body>
</html>
