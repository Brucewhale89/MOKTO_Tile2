<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <meta charset="utf-8">
  <title>마이페이지 — MOKTO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&amp;family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
:root { --terra:#c9610d; --terra-light:#e5822a; --tan:#dbab55; --bg:#3a2a22; --text:#f0e9e0; --muted:#a89a8c; --border:rgba(255,255,255,0.14); }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Public Sans',sans-serif; line-height:1.6; }
a { color: var(--terra-light); text-decoration: none; }
a:hover { color: var(--tan); }
  </style>
</helmet>

<header style="background:#1e120c;padding:20px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;border-bottom:1px solid rgba(255,255,255,0.1)">
  <a href="Home.dc.html" style="font-family:'Archivo',sans-serif;font-weight:900;font-size:22px;letter-spacing:-0.02em;color:#fff;display:flex;align-items:baseline"><span style="color:var(--terra-light)">MOK</span>TO<em style="font-family:'Public Sans',sans-serif;font-style:normal;font-weight:600;font-size:11px;letter-spacing:0.14em;color:rgba(255,255,255,0.55);margin-left:9px;align-self:center">TILE SUPPLY</em></a>
  <nav style="display:flex;align-items:center;gap:22px">
    <a href="Home.dc.html" style="color:rgba(255,255,255,0.78);font-size:13px;font-weight:600">상품 목록</a>
    <a href="MyPage.dc.html" style="color:#fff;font-size:13px;font-weight:700">마이페이지</a>
    <sc-if value="{{ loggedIn }}" hint-placeholder-val="{{ false }}">
      <a href="Home.dc.html" onClick="{{ onLogout }}" style="color:rgba(255,255,255,0.78);font-size:13px;font-weight:600">로그아웃</a>
    </sc-if>
    <a href="Cart.dc.html" style="color:rgba(255,255,255,0.8);display:inline-flex;align-items:center">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
    </a>
  </nav>
</header>

<main style="max-width:1000px;margin:0 auto;padding:40px 32px 80px">
  <div style="margin-bottom:8px;font-size:13px;color:var(--muted);font-weight:600">{{ greeting }}</div>
  <h1 style="font-family:'Archivo',sans-serif;font-weight:900;font-size:30px;letter-spacing:-0.02em;margin:0 0 30px">마이페이지</h1>

  <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:18px">
    <a href="Profile.dc.html" style="display:block;background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:12px;padding:26px 24px;color:var(--text)">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(201,97,13,0.18);display:flex;align-items:center;justify-content:center;margin-bottom:16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--terra-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
      </div>
      <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;margin-bottom:5px">개인정보 수정</div>
      <div style="font-size:13px;color:var(--muted)">담당자 정보와 배송지를 관리합니다</div>
    </a>

    <a href="Cart.dc.html" style="display:block;background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:12px;padding:26px 24px;color:var(--text)">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(201,97,13,0.18);display:flex;align-items:center;justify-content:center;margin-bottom:16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--terra-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
      </div>
      <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;margin-bottom:5px">장바구니</div>
      <div style="font-size:13px;color:var(--muted)">{{ cartLabel }}</div>
    </a>

    <a href="OrderHistory.dc.html" style="display:block;background:rgba(255,255,255,0.045);border:1px solid var(--border);border-radius:12px;padding:26px 24px;color:var(--text)">
      <div style="width:40px;height:40px;border-radius:10px;background:rgba(201,97,13,0.18);display:flex;align-items:center;justify-content:center;margin-bottom:16px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--terra-light)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3L22 4"></path><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
      </div>
      <div style="font-family:'Archivo',sans-serif;font-weight:800;font-size:17px;margin-bottom:5px">주문 내역</div>
      <div style="font-size:13px;color:var(--muted)">지난 주문과 배송 상태를 확인합니다</div>
    </a>
  </div>
</main>

<footer style="background:#1e120c;border-top:1px solid rgba(255,255,255,0.1);padding:32px;text-align:center;color:rgba(255,255,255,0.7);font-size:12.5px">
  MOKTO 목토 · B2B 전용 온라인 자재 공급
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { session: null, cart: [] };

  componentDidMount() {
    // 관리자 표시명 마이그레이션
    try {
      const AEMAIL = 'admin@ssoltile.com', ANAME = '강수민';
      let us = JSON.parse(localStorage.getItem('ssol_users') || '[]');
      let changed = false;
      us.forEach(u => { if (u.email === AEMAIL && u.name !== ANAME) { u.name = ANAME; changed = true; } });
      if (changed) localStorage.setItem('ssol_users', JSON.stringify(us));
      const ss = JSON.parse(localStorage.getItem('ssol_session') || 'null');
      if (ss && ss.email === AEMAIL && ss.name !== ANAME) localStorage.setItem('ssol_session', JSON.stringify({ ...ss, name: ANAME }));
    } catch (e) {}
    let session = null, cart = [];
    try { session = JSON.parse(localStorage.getItem('ssol_session') || 'null'); } catch (e) {}
    try { cart = JSON.parse(localStorage.getItem('mokto_cart') || '[]'); } catch (e) {}
    this.setState({ session, cart });
  }

  renderVals() {
    const s = this.state.session;
    const boxes = this.state.cart.reduce((n, i) => n + i.qty, 0);
    return {
      loggedIn: !!s,
      greeting: s ? `${s.name} 님, 안녕하세요` : '로그인이 필요합니다',
      cartLabel: this.state.cart.length ? `${this.state.cart.length}개 품목 · ${boxes}박스 담겨 있습니다` : '담긴 상품이 없습니다',
      onLogout: () => { try { localStorage.removeItem('ssol_session'); } catch (e) {} },
    };
  }
}
</script>
</body>
</html>
